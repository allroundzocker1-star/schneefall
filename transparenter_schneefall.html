<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transparenter Schneefall</title>
<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: transparent !important;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    background: transparent;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="snow" aria-label="Fallende Schneeflocken"></canvas>
<script>
(() => {
  const canvas = document.getElementById('snow');
  const ctx = canvas.getContext('2d');
  let width = 0, height = 0, flakes = [];
  const COUNT = 260;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    flakes = Array.from({ length: COUNT }, () => makeFlake(true));
  }

  function makeFlake(randomY = false) {
    const r = Math.random() * 3.4 + 0.7;
    return {
      x: Math.random() * width,
      y: randomY ? Math.random() * height : -10,
      r,
      speed: 0.8 + Math.random() * 2.6,
      drift: (Math.random() - 0.5) * 0.9,
      sway: Math.random() * Math.PI * 2,
      swaySpeed: 0.008 + Math.random() * 0.025,
      alpha: 0.45 + Math.random() * 0.55
    };
  }

  function draw() {
    ctx.clearRect(0, 0, width, height);

    for (const f of flakes) {
      f.sway += f.swaySpeed;
      f.x += f.drift + Math.sin(f.sway) * 0.55;
      f.y += f.speed;

      if (f.y > height + 12) {
        Object.assign(f, makeFlake());
      }
      if (f.x < -12) f.x = width + 12;
      if (f.x > width + 12) f.x = -12;

      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${f.alpha})`;
      ctx.shadowColor = 'rgba(255,255,255,0.75)';
      ctx.shadowBlur = f.r > 2 ? 7 : 3;
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  resize();
  draw();
})();
</script>
</body>
</html>
